  <meta name="robots" content="noindex">
  <!-- fresh-guard v3 (2026-10-21) — 배포 직후에도 강력 새로고침 없이 새 화면을 보이게 한다.
       GitHub Pages 는 HTML 을 max-age=600 으로 준다. 브라우저도, GitHub 앞단 캐시(Fastly)도 그동안 옛 HTML 을 줄 수 있다
       (Cloudflare 는 HTML 을 캐시하지 않는다 — cf-cache-status: DYNAMIC 실측).
       여기서 하는 일: 지금 화면의 Last-Modified(document.lastModified)와 서버의 최신 값(HEAD)을 비교해,
       서버 쪽이 새로우면 「?_fg=<판>」을 붙인 주소로 한 번 옮겨 간다. 질의가 붙은 주소는 브라우저 캐시에도 Fastly 캐시에도
       없어 반드시 새 판이 온다(실측 x-cache: MISS). 붙은 _fg 는 새 화면이 뜨자마자 주소창에서 지운다. 같은 판으로 두 번 돌지 않는다.
       v2: 열 때만이 아니라 앱 안 메뉴 이동(pushState·hashchange·popstate) 때도 15초에 한 번까지 다시 잰다(열어 둔 탭).
       v3: location.reload() 대신 질의 붙은 주소로 — reload 가 Fastly 에 남은 옛 판을 다시 받아 멈추던 것(10-21 build-data 강의안).
       탭 전환·포커스로는 옮기지 않는다(입력 유실). ETag 는 Cloudflare 가 지워서 쓸 수 없다. 원본: dreamit-1000/scripts/fresh-guard/guard.html -->
  <script>(function(){try{var L=location,P='_fg',h=window.history,q=L.search;if(/[?&]_fg=/.test(q)&&h&&h.replaceState){q=q.replace(/([?&])_fg=[^&]*&?/,'$1').replace(/[?&]$/,'');h.replaceState(h.state,'',L.pathname+q+L.hash);}var d=Date.parse(document.lastModified),u=L.pathname+L.search,k='__fresh_guard',t=0;if(!d||!window.fetch||!window.sessionStorage)return;var g=function(s,v){return s+(s.indexOf('?')<0?'?':'&')+P+'='+v;};var c=function(){var n=Date.now();if(n-t<15000)return;t=n;fetch(g(u,n),{method:'HEAD',cache:'no-store'}).then(function(r){var lm=r.headers.get('last-modified'),f=lm&&Date.parse(lm);if(!f||f<=d+1000)return;if(sessionStorage.getItem(k)===lm)return;sessionStorage.setItem(k,lm);L.replace(g(L.pathname+L.search,f)+L.hash);})['catch'](function(){});};c();var p=h&&h.pushState;if(p)h.pushState=function(){var x=p.apply(this,arguments);c();return x;};addEventListener('hashchange',c);addEventListener('popstate',c);}catch(e){}})();</script>
